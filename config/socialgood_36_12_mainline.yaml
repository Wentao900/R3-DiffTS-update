#type: args

train:
  epochs: 100
  batch_size: 16
  lr: 0.001
  itr_per_epoch: 100000000.0
  multi_res_horizons: null
  multi_res_use_stat_horizons: true
  multi_res_acf_drop_threshold: 0.5
  multi_res_acf_zero_threshold: 0.1
  multi_res_acf_max_lag: null
  multi_res_acf_num_samples: 128
  multi_res_loss_weight: 0.1
  multi_res_use_huber: true
  multi_res_huber_delta: 1.0
  multi_res_huber_deltas:
  - 0.5
  - 0.8
  - 1.0
  - 1.5
  multi_res_huber_delta_mode: functional
  multi_res_huber_delta_scale: 0.5
  multi_res_dynamic: true
  multi_res_dynamic_by_t: true
  multi_res_dynamic_by_epoch: true
  multi_res_dynamic_by_trend: true
  multi_res_dynamic_min_weight: 0.2
  multi_res_progressive: true
  multi_res_ema_alpha: 0.05
  multi_res_difficulty_weight: 0.5
  multi_res_group_balance: true
  multi_res_group_max_ratio: 2.0
  lr_warmup_epochs: 10
  max_grad_norm: 1.0
  adaptive_noise_scale: 0.0
  auxiliary_loss_max_ratio: 0.5
  coarse_forecast_weight: 0.05
  uncertainty_forecast_weight: 0.02
diffusion:
  layers: 6
  channels: 128
  nheads: 8
  diffusion_embedding_dim: 128
  beta_start: 0.0001
  beta_end: 0.5
  num_steps: 500
  schedule: quad
  is_linear: false
  noise_esti: false
  cfg: true
  c_mask_prob: 0.05
  ddim: true
  sample_steps: 50
  sample_method: quad
  pre_norm: false
model:
  cot_model: ./gpt2-medium
  cot_temperature: 0.2
  cot_max_new_tokens: 64
  cot_cache_dir: .rag_cot_cache/socialgood_36_12
  is_unconditional: 0
  timeemb: 128
  featureemb: 16
  guide_w_default: 1.0
  target_strategy: test
  num_sample_features: 64
  rag_stage1_topk: 3
  rag_stage2_topk: 1
  rag_topk: 1
  timestep_branch: false
  timestep_emb_cat: true
  with_texts: true
  relative_size_emb_cat: false
  decomp: false
  llm: bert
  llm_layers: 0
  use_rag_cot: true
  use_two_stage_rag: true
  text_quality_coverage_mix: 0.5
  text_quality_weights:
  - 0.5
  - 0.3
  - 0.2
  text_trust_ret: 0.75
  text_trust_cot: 0.5
  text_quality_drop_threshold: 0.3
  text_quality_mid_threshold: 0.6
  text_max_length: 160
  text_encode_batch_size: 4
  use_forecast_policy_controller: true
  use_aux_forecast_heads: true
  use_coarse_forecast_head: true
  use_uncertainty_head: true
  coarse_forecast_blend: 0.15
  coarse_forecast_factor: 4
  aux_forecast_hidden_dim: 128
  forecast_policy_controller:
    enabled: true
    fine_topk_ratio: 0.35
    max_fine_ratio: 0.6
    min_fine_points: 1
    rag_invalid_scale: 0.25
    cov_invalid_scale: 0.1
    coarse_invalid_scale: 0.2
    uncertainty_invalid_scale: 0.2
    unclear_trend_scale: 0.5
    sample_budget_floor: 0.5
    sample_budget_ceiling: 1.0
    turning_center: 0.35
    turning_width: 0.18
dataset:
  use_all_numeric_features: true
  aug_noise_std: 0.01
  aug_time_warp_prob: 0.3
  aug_segment_scale_std: 0.1
  text_recency_tau_days: 14.0
  text_coverage_kappa: 3.0
  max_text_events: 8
  num_workers: 0
