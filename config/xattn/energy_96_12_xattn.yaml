# Gated cross-attention config generated by scripts/materialize_xattn_configs.py
# A1 is the main method. Ablation files change one factor relative to A1.
train:
  epochs: 150
  batch_size: 64
  lr: 0.0025
  itr_per_epoch: 100000000.0
  multi_res_horizons:
  - 1
  - 3
  - 6
  - 12
  multi_res_use_stat_horizons: false
  multi_res_acf_drop_threshold: 0.5
  multi_res_acf_zero_threshold: 0.1
  multi_res_acf_max_lag: null
  multi_res_acf_num_samples: 128
  multi_res_loss_weight: 0.1
  multi_res_use_huber: true
  multi_res_huber_delta: 1.0
  multi_res_huber_deltas: null
  multi_res_huber_delta_mode: fallback_uniform
  multi_res_huber_delta_scale: 0.5
  multi_res_dynamic: false
  multi_res_dynamic_by_t: false
  multi_res_dynamic_by_epoch: false
  multi_res_dynamic_by_trend: false
  multi_res_dynamic_min_weight: 0.2
  multi_res_progressive: false
  multi_res_ema_alpha: 0.05
  multi_res_difficulty_weight: 0.0
  multi_res_group_balance: true
  multi_res_group_max_ratio: 2.0
  lr_warmup_epochs: 10
  max_grad_norm: 1.0
  adaptive_noise_scale: 0.0
  auxiliary_loss_max_ratio: 0.0
  coarse_forecast_weight: 0.0
  uncertainty_forecast_weight: 0.0
  multi_res_segment_loss: false
  pattern_consistency_weight: 0.0
  pattern_expert_weight: 0.05
  valid_loss_main_only: true
  forecast_calibrator: false
diffusion:
  layers: 4
  channels: 64
  nheads: 8
  diffusion_embedding_dim: 128
  beta_start: 0.0001
  beta_end: 0.6
  num_steps: 300
  schedule: quad
  is_linear: false
  noise_esti: false
  cfg: true
  c_mask_prob: 0.2
  ddim: true
  sample_steps: 90
  sample_method: quad
  pre_norm: false
  mask_noisy_target: true
  sampler_fix: true
  tower_dropout: 0.0
model:
  cot_model: ./gpt2-medium
  cot_temperature: 0.2
  cot_max_new_tokens: 64
  cot_cache_dir: .rag_cot_cache/energy_96_12
  is_unconditional: 0
  timeemb: 128
  featureemb: 16
  guide_w_default: 1.0
  target_strategy: test
  num_sample_features: 64
  rag_stage1_topk: 3
  rag_stage2_topk: 1
  rag_topk: 1
  timestep_branch: false
  timestep_emb_cat: true
  with_texts: true
  relative_size_emb_cat: false
  decomp: false
  llm: bert
  llm_layers: 0
  use_rag_cot: true
  use_two_stage_rag: false
  text_quality_coverage_mix: 0.5
  text_quality_weights:
  - 0.5
  - 0.3
  - 0.2
  text_trust_ret: 0.75
  text_trust_cot: 0.5
  text_quality_drop_threshold: 0.3
  text_quality_mid_threshold: 0.6
  text_max_length: 160
  text_encode_batch_size: 4
  use_forecast_policy_controller: false
  use_aux_forecast_heads: false
  use_coarse_forecast_head: false
  use_uncertainty_head: false
  coarse_forecast_blend: 0.0
  coarse_forecast_factor: 4
  aux_forecast_hidden_dim: 128
  forecast_policy_controller:
    enabled: true
    fine_topk_ratio: 0.35
    max_fine_ratio: 0.6
    min_fine_points: 1
    rag_invalid_scale: 0.25
    unclear_trend_scale: 0.5
    sample_budget_floor: 0.5
    sample_budget_ceiling: 1.0
    turning_center: 0.35
    turning_width: 0.18
  force_legacy_entrypoint: false
  timestep_outer_mix: none
  text_injection: gated
  pattern_expert_set: fpp4
  pattern_router_mode: linear_history
  baseline_form: fpp4
  season_period: 52
  pattern_text_evidence: false
  pattern_reliability: false
  pattern_aux_reliability: false
  guide_mode: manual
  final_method: false
  text_validity_gate: true
  text_gate_mode: learned
  text_validity_loss: true
  cfg_output_combine: true
  text_features_mode: none
  skip_cot_generation: true
  numeric_summary_target_only: true
  cot_as_source: false
  n_text_sources: 2
  shuffle_text_in_batch: false
  text_drop_prob: 0.0
  idf_fit_train_only: true
  text_encoder_eval: true
dataset:
  use_all_numeric_features: true
  aug_noise_std: 0.01
  aug_time_warp_prob: 0.3
  aug_segment_scale_std: 0.1
  text_recency_tau_days: 14.0
  text_coverage_kappa: 3.0
  max_text_events: 8
  num_workers: 0
  text_features_mode: none
