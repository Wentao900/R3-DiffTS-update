# Three seeds for the unified protocol.
# The main comparison averages these three runs first, then applies a
# per-window Harvey-Leybourne-Newbold test (HLN-DM; Harvey, Leybourne and
# Newbold 1997). Across seeds, report only the mean and the standard deviation.
# 2024, 2025 and 2026 replace the earlier six-seed sign-test list.
alpha: 0.05
seeds:
  - 2024
  - 2025
  - 2026
