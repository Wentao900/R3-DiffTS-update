train:
  epochs: 150
  batch_size: 32
  lr: 0.0025
  itr_per_epoch: 1.0e+8
  multi_res_horizons: [1, 3, 6, 12]
  multi_res_loss_weight: 0.05
  multi_res_use_huber: true
  multi_res_huber_delta: 1.0
  multi_res_dynamic: true
  multi_res_dynamic_by_t: true
  multi_res_dynamic_by_epoch: true
  multi_res_dynamic_by_trend: true
  multi_res_dynamic_min_weight: 0.2
  coarse_fine:
    enabled: true
    coarse_factor: 3
    low_risk_residual_scale: 0.2
  losses:
    pred_weight: 1.0
    dir_weight: 0.1
    slope_weight: 0.05
    turn_weight: 0.05
    res_consistency_weight: 0.05
    guidance_consistency_weight: 0.02
    budget_weight: 0.01
    uncertainty_nll_weight: 0.05
    budget_target_ratio: 0.35
    budget_target_steps: 0.75

diffusion:
  layers: 6
  channels: 64
  nheads: 8
  diffusion_embedding_dim: 128
  beta_start: 0.0001
  beta_end: 0.6
  num_steps: 300
  schedule: "quad"
  is_linear: False
  noise_esti: False
  cfg: True
  c_mask_prob: 0.05
  ddim: True
  sample_steps: 20
  sample_method: "quad"
  pre_norm: False
  residual:
    enabled: true
    base_enabled: true
    hidden_dim: 128
  trend_schedule:
    enabled: true
    flat_scale: 1.2
    turning_scale: 0.85
    volatile_scale: 1.1
    local_risk_scale: 0.35
  fast_sampling:
    enabled: true
    sample_steps: 12
    backend: legacy
    future_backends: [rectified_flow, flow_matching]

model:
  cot_model: ./gpt2-medium
  cot_temperature: 0.2
  cot_max_new_tokens: 64
  is_unconditional: 0
  timeemb: 128
  featureemb: 16
  guide_w_default: 1.0
  target_strategy: "test"
  num_sample_features: 64
  rag_stage1_topk: 3
  rag_stage2_topk: 1
  rag_topk: 1
  timestep_branch: False
  timestep_emb_cat: True
  with_texts: True
  relative_size_emb_cat: False
  decomp: False
  llm: "bert"
  llm_layers: 0
  use_rag_cot: true
  use_two_stage_rag: true
  controller:
    enabled: true
    fine_topk_ratio: 0.35
    max_fine_ratio: 0.6
    min_fine_points: 1
    rag_invalid_scale: 0.25
    unclear_trend_scale: 0.5
    sample_budget_floor: 0.5
    sample_budget_ceiling: 1.0
  guidance:
    enabled: true
    include_full_text_context: true
    use_retrieval_summary: true
    use_reasoning_summary: true
    use_regime_token: true
    step_power: 1.0
    min_scale: 0.05
    max_scale: 1.0
    summary_max_tokens: 96
    summary_feature_dim: 64
  uncertainty:
    enabled: true
    hidden_dim: 128
